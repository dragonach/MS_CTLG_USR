name: Hola Mundo

# on: [push, pull_request]
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  primer_job:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: mydatabase

      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
#    - uses: actions/checkout@v2
    - name: Primer Paso ejecuta un script
      run: echo Hello, world!
    - name: Segundo Paso ejecuta un script
      run: |
        echo Add other actions to build,
        echo test, and deploy your project.
  segundo_job:
    runs-on: ubuntu-latest
    needs: primer_job
    env:
      My_ENV_VAR: "This is an environment variable"
    steps:
      - name: Ejecuta el comando ls
        run: ls
      - name: imprime la variable de entorno
        run: echo "El valor de la variable de entorno es $My_ENV_VAR"  

  tercer_job:
    runs-on: ubuntu-latest
    needs: segundo_job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Ejecuta el my_action
        uses: ./.github/actions/my_action/
        with:
          my_input: "value for my input"
