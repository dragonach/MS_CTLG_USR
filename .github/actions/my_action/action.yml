name: "My Action"
description: "This is my custom action"

inputs:
  my_input:
    description: "An input for my action"
    required: true
    default: "default value"

runs:
  using: "composite"

  steps:
    - name: "Run a script from my action"
      run: |
        echo "Primer comando de my action"
        ls -l 
        echo "Segundo comando de my action"
        pwd
        echo "Input value: ${{ inputs.my_input }}"
      shell: bash